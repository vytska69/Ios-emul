name: IPA

# Builds the QEMU frameworks and an installable .ipa so the app can be put on a phone without a Mac:
# install the artifact with TrollStore (entitlements are fake-signed in) or SideStore (re-signs it).
on:
  workflow_dispatch:
    inputs:
      tci:
        description: "Build the TCG interpreter instead of the JIT (works without JIT, slower)"
        type: boolean
        default: false
  push:
    branches: [claude/ipsw-emulator-app, main, master]
    # Only changes that end up in the IPA; the QEMU build takes ~20 minutes and a newer push
    # replaces a queued run, so test-only and documentation pushes must not restart it.
    paths:
      - "App/**"
      - "Sources/IPSWKit/**"
      - "Sources/EmulatorKit/**"
      - "qemu/**"
      - "scripts/build-qemu-ios.sh"
      - "scripts/make-sidestore-source.py"
      - "project.yml"
      - "Package.swift"
      - ".github/workflows/ipa.yml"

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          brew install meson ninja pkg-config glib gettext libgpg-error bison cmake xcodegen ldid
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          python3 -m pip install --break-system-packages six pyparsing setuptools pyyaml distlib mako

      - name: Resolve QEMU fork revisions
        id: forks
        run: |
          rev() { git ls-remote "$1" "refs/heads/$2" | cut -c1-12; }
          echo "key=$(rev https://github.com/ChefKissInc/QEMUAppleSilicon.git master)-$(rev https://github.com/devos50/qemu-ios.git ipod_touch_2g)-$(rev https://github.com/devos50/qemu-ios.git ipod_touch_1g)" >> "$GITHUB_OUTPUT"

      - name: Cache QEMU frameworks
        id: cache
        uses: actions/cache@v4
        with:
          path: App/Frameworks
          key: qemu-ios-${{ inputs.tci && 'tci' || 'jit' }}-${{ hashFiles('scripts/build-qemu-ios.sh', 'qemu/patches/**') }}-${{ steps.forks.outputs.key }}

      # A failed QEMU build does not hold back the release: the app is still built and published,
      # and the release notes say the emulator core is missing until the next green build.
      - name: Build QEMU for iOS
        id: qemu
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: scripts/build-qemu-ios.sh ${{ inputs.tci && '--tci' || '' }}

      - name: Emulator core status
        id: core
        run: |
          if ls App/Frameworks/*.framework >/dev/null 2>&1; then
            echo "included=true" >> "$GITHUB_OUTPUT"
            # QEMU's VNC server exits without its keymaps; the cache holds only App/Frameworks.
            mkdir -p App/QEMUData/keymaps
            cp qemu/keymaps/* App/QEMUData/keymaps/
            rm -f App/QEMUData/keymaps/README.md
          else
            rm -rf App/Frameworks App/QEMUData
            echo "included=false" >> "$GITHUB_OUTPUT"
            echo "::warning::QEMU for iOS did not build; this IPA has no emulator core"
          fi

      - name: Build app
        run: |
          xcodegen generate
          # TCI builds run without JIT; tell the app so it does not ask for it (QEMURunner.needsJIT).
          if [ "${{ inputs.tci }}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Add :IOSEmulQEMUInterpreter bool true" App/Info.plist
          fi
          xcodebuild -project IOSEmul.xcodeproj -scheme IOSEmul -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="0.1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 80
          exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/IOSEmul.app
          # Frameworks first, then the app, so the outer signature covers the nested ones.
          for fw in "$APP"/Frameworks/*.framework; do
            [ -e "$fw" ] && ldid -S "$fw/$(basename "$fw" .framework)"
          done
          ldid -SApp/IOSEmul.entitlements "$APP/IOSEmul"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry IOSEmul.ipa Payload)
          ls -lh out/IOSEmul.ipa

      - name: SideStore source
        run: |
          python3 scripts/make-sidestore-source.py --ipa out/IOSEmul.ipa \
            --repo "${{ github.repository }}" \
            --tag Rolling --commit "${{ github.sha }}" --out out/sidestore.json \
            ${{ steps.core.outputs.included != 'true' && '--no-core' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: IOSEmul-ipa
          path: |
            out/IOSEmul.ipa
            out/sidestore.json
          if-no-files-found: error

      # Rolling release: the "Rolling" release follows the default branch, and its release always holds
      # the newest IPA and the SideStore source, so these URLs never change:
      #   .../releases/download/Rolling/IOSEmul.ipa
      #   .../releases/download/Rolling/sidestore.json   (add this to SideStore as a source)
      - name: Publish rolling release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The 'Rolling' tag is created once by hand and then left alone: GITHUB_TOKEN may not create
          # refs that contain .github/workflows, and the download URLs only need the tag name.
          if [ "${{ steps.core.outputs.included }}" = "true" ]; then
            core="Includes the QEMU emulator core."
          else
            core="Note: this build has NO emulator core yet (QEMU for iOS failed to build in run ${{ github.run_id }}); the app opens and inspects IPSWs but cannot boot them. The next green build replaces it."
          fi
          notes="Rolling build 0.1.${{ github.run_number }} of ${GITHUB_SHA:0:7}. $core

          Install: add https://github.com/${{ github.repository }}/releases/download/Rolling/sidestore.json as a source in SideStore, or open IOSEmul.ipa with TrollStore."
          if gh release view Rolling >/dev/null 2>&1; then
            gh release edit Rolling --title "Rolling build" --notes "$notes"
          else
            # GITHUB_TOKEN may not create the tag itself (403), so it has to exist already.
            if ! git ls-remote --exit-code --tags origin refs/tags/Rolling >/dev/null; then
              echo "::error::Tag 'Rolling' is missing. Create it once with: git push origin HEAD:refs/tags/Rolling"
              exit 1
            fi
            gh release create Rolling --verify-tag --title "Rolling build" --notes "$notes" --prerelease
          fi
          gh release upload Rolling out/IOSEmul.ipa out/sidestore.json --clobber

name: IOSEmul
options:
  bundleIdPrefix: com.iosemul
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  IOSEmulCore:
    path: .
targets:
  IOSEmul:
    type: application
    platform: iOS
    sources:
      - path: App/IOSEmul
      - path: App/Assets.xcassets
      - path: App/Frameworks
        optional: true
        buildPhase: none
    dependencies:
      - package: IOSEmulCore
        product: IPSWKit
      - package: IOSEmulCore
        product: EmulatorKit
    entitlements:
      path: App/IOSEmul.entitlements
      properties:
        # Needed for QEMU's TCG JIT when the app is sideloaded with a development profile
        # and launched with a debugger/JIT enabler attached.
        get-task-allow: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iOS Emul
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        # Silent audio keeps a running machine going in the background (Settings > Emulator).
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosemul.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # QEMU frameworks built by scripts/build-qemu-ios.sh are copied in by the phase below.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
    postBuildScripts:
      - name: Embed QEMU frameworks
        basedOnDependencyAnalysis: false
        script: |
          SRC="${PROJECT_DIR}/App/Frameworks"
          [ -d "$SRC" ] || { echo "warning: App/Frameworks missing; run scripts/build-qemu-ios.sh to embed QEMU"; exit 0; }
          DST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$DST"
          # QEMU data files (keymaps, firmware) built alongside the frameworks.
          if [ -d "${PROJECT_DIR}/App/QEMUData" ]; then
            rsync -a --delete "${PROJECT_DIR}/App/QEMUData/" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/QEMUData/"
          fi
          for fw in "$SRC"/*.framework; do
            [ -e "$fw" ] || continue
            rsync -a --delete "$fw" "$DST/"
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --preserve-metadata=identifier,entitlements "$DST/$(basename "$fw")"
            fi
          done
  # The Mac version: the same installer (EmulatorKit) with QEMU as a helper process in
  # Contents/MacOS, put there by scripts/bundle-qemu-macos.sh.
  IOSEmulMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App/Mac
    dependencies:
      - package: IOSEmulCore
        product: IPSWKit
      - package: IOSEmulCore
        product: EmulatorKit
    entitlements:
      path: App/Mac/IOSEmulMac.entitlements
      properties:
        # QEMU's Hypervisor.framework accelerator (-accel hvf) runs in the helper process,
        # which is signed with the same entitlement.
        com.apple.security.hypervisor: true
    info:
      path: App/Mac/Info.plist
      properties:
        CFBundleDisplayName: iOS Emul
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosemul.mac
        PRODUCT_NAME: iOS Emul
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
